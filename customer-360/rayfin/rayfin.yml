id: customer-360
name: customer-360
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://hazy-slate-bd43ec62ab-westus.webapp.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: c360lakehouse
    type: fabric-sqlanalytics
    config:
      workspaceId: a8971f73-fcb7-4423-8b60-6ebdaa13fe59
      itemId: 27e80b1b-85a7-48fa-a696-1d50f9446b4c
    auth:
      type: application
    operations:
      - name: read
